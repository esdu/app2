name: iOS CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Inspect available Xcode
        run: |
          mkdir -p artifacts
          xcode-select -p | tee artifacts/xcode-path.txt
          xcodebuild -version | tee artifacts/xcode-version.txt
          xcrun simctl list runtimes | tee artifacts/runtimes.txt
      - name: Validate source privacy declaration
        run: |
          set -o pipefail
          python3 scripts/validate_privacy_manifest.py 2>&1 | tee artifacts/privacy-source.log
      - name: Select an available iPhone
        run: |
          SIMULATOR_ID=$(python3 scripts/select_simulator.py)
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
          xcrun simctl list devices available --json > artifacts/simulator-device.json
      - name: Validate CI diagnostic tooling
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Resolve dependencies
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies -project LittleMoments.xcodeproj -scheme LittleMoments CODE_SIGNING_ALLOWED=NO 2>&1 | tee artifacts/dependencies.log
      - name: Compile application and tests
        id: build
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project LittleMoments.xcodeproj -scheme LittleMoments -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath build/DerivedData -resultBundlePath artifacts/Build.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee artifacts/build.log
      - name: Validate built app privacy manifest
        run: |
          set -o pipefail
          python3 scripts/validate_privacy_manifest.py build/DerivedData/Build/Products/Debug-iphonesimulator/LittleMoments.app/PrivacyInfo.xcprivacy 2>&1 | tee artifacts/privacy-simulator.log
      - name: Boot selected iPhone
        run: |
          xcrun simctl boot "$SIMULATOR_ID" || test "$(xcrun simctl list devices booted -j | python3 -c 'import json,sys; print(any(d["udid"] == sys.argv[1] for ds in json.load(sys.stdin)["devices"].values() for d in ds))' "$SIMULATOR_ID")" = True
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
      - name: Run all unit and UI tests
        run: python3 scripts/run_ci_tests.py ordinary
      - name: Repeat focused recorder and lifecycle tests until first failure
        run: python3 scripts/run_ci_tests.py stress --iterations 3
      - name: Archive unsigned iOS app and validate its privacy manifest
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -o pipefail
          xcodebuild archive -project LittleMoments.xcodeproj -scheme LittleMoments -configuration Release -destination 'generic/platform=iOS' -archivePath build/LittleMoments.xcarchive -derivedDataPath build/ArchiveDerivedData -resultBundlePath artifacts/Archive.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee artifacts/archive.log
          python3 scripts/validate_privacy_manifest.py build/LittleMoments.xcarchive/Products/Applications/LittleMoments.app/PrivacyInfo.xcprivacy 2>&1 | tee artifacts/privacy-archive.log
          cp build/LittleMoments.xcarchive/Products/Applications/LittleMoments.app/PrivacyInfo.xcprivacy artifacts/Archived-PrivacyInfo.xcprivacy
      - name: Preserve simulator diagnostics and screenshots
        if: always()
        run: |
          if [ -n "$SIMULATOR_ID" ]; then
            xcrun simctl io "$SIMULATOR_ID" screenshot artifacts/final-screen.png || true
            xcrun simctl spawn "$SIMULATOR_ID" log show --last 15m --style compact --predicate 'process == "LittleMoments"' > artifacts/simulator.log 2>&1 || true
          fi
      - name: Summarize tests and export per-run crash diagnostics
        if: always()
        timeout-minutes: 6
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p artifacts
          python3 scripts/summarize_ci.py 2>&1 | tee artifacts/diagnostic-summary.log
      - name: Upload test results and diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-results-${{ github.run_attempt }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn
